name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Android ──────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ── macOS ─────────────────────────────────────────────
  build-macos:
    name: macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r Octo21-macOS.zip octo21_app.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/Build/Products/Release/Octo21-macOS.zip

  # ── Windows ───────────────────────────────────────────
  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip Windows build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Octo21-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: Octo21-Windows.zip

  # ── iOS ───────────────────────────────────────────────
  build-ios:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Octo21-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Octo21-iOS.ipa

  # ── GitHub Release ────────────────────────────────────
  release:
    name: Create Release
    needs: [build-android, build-macos, build-windows, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename files
        run: |
          mv artifacts/android-apk/app-release.apk artifacts/Octo21-Android.apk
          mv artifacts/macos-app/Octo21-macOS.zip artifacts/Octo21-macOS.zip
          mv artifacts/windows-exe/Octo21-Windows.zip artifacts/Octo21-Windows.zip
          mv artifacts/ios-ipa/Octo21-iOS.ipa artifacts/Octo21-iOS.ipa
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Octo21-Android.apk
            artifacts/Octo21-macOS.zip
            artifacts/Octo21-Windows.zip
            artifacts/Octo21-iOS.ipa
          generate_release_notes: true
